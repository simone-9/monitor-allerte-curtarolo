name: Monitoraggio allerte CFD Veneto

on:
  schedule:
    - cron: "*/10 * * * *"     # ogni 10 minuti, 24 ore su 24
  workflow_dispatch:            # avvio manuale dal pulsante "Run workflow"
    inputs:
      test_telegram:
        description: "Invia solo un messaggio di prova su Telegram"
        type: boolean
        default: false

concurrency:
  group: monitor-allerte
  cancel-in-progress: false

jobs:
  controlla:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Controlla il CFD e aggiorna Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_TELEGRAM: ${{ inputs.test_telegram }}
        run: python monitor_allerte.py
